<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서브노트 뷰어</title>
  <style>
    :root {
      --bg:          #f5f4ef;
      --sidebar-bg:  #1e202b;
      --sidebar-w:   264px;
      --header-h:    52px;
      --text:        #37352f;
      --muted:       #9a9692;
      --border:      #e6e3dc;
      --accent:      #c17550;
      --active-bg:   #353849;
      --active-text: #a8c5ff;
      --hover:       #272a38;
      --domain-bg:   #262934;
      --tag-bg:      #373d52;
      --tag-text:    #9fb3ff;
      --content-bg:  #ffffff;
      --font:        -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; font-family: var(--font); }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); }

    /* ── 헤더 ── */
    header {
      height: var(--header-h); flex-shrink: 0;
      background: var(--sidebar-bg);
      display: flex; align-items: center; padding: 0 16px; gap: 12px;
      border-bottom: 1px solid rgba(255,255,255,.05);
    }
    .logo { font-size: .93rem; font-weight: 700; color: #e0ddd6; letter-spacing: -.01em; }
    .logo em { color: var(--accent); font-style: normal; }

    .btn-menu {
      display: none; background: none; border: none; color: #888; cursor: pointer;
      padding: 5px 7px; font-size: 1rem; border-radius: 5px; line-height: 1;
    }
    .btn-menu:hover { background: rgba(255,255,255,.08); color: #ccc; }

    .breadcrumb {
      margin-left: auto;
      font-size: .75rem; color: #888;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.08);
      padding: 4px 12px; border-radius: 20px;
      max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .header-right { display: flex; align-items: center; gap: 6px; }

    .nav-btn {
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1);
      color: #ccc; cursor: pointer; border-radius: 8px;
      width: 40px; height: 40px; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s, color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn:hover:not(:disabled) { background: rgba(255,255,255,.14); color: #fff; }
    .nav-btn:active:not(:disabled) { background: rgba(255,255,255,.2); }
    .nav-btn:disabled { opacity: .25; cursor: default; }

    @media (max-width: 680px) {
      .nav-btn { width: 44px; height: 44px; font-size: 1.1rem; }
      .breadcrumb { max-width: 120px; font-size: .7rem; }
    }

    /* ── 레이아웃 ── */
    .layout { display: flex; flex: 1; min-height: 0; }

    /* ── 사이드바 ── */
    aside {
      width: var(--sidebar-w); flex-shrink: 0;
      background: var(--sidebar-bg); overflow-y: auto; overflow-x: hidden;
    }
    aside::-webkit-scrollbar { width: 3px; }
    aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 2px; }

    .domain-btn {
      width: 100%; display: flex; align-items: center; gap: 9px;
      padding: 9px 14px; background: none; border: none;
      border-bottom: 1px solid rgba(255,255,255,.03);
      cursor: pointer; text-align: left; color: #b0ab9f;
      font-family: var(--font); font-size: .8rem; transition: background .12s;
    }
    .domain-btn:hover { background: var(--hover); }
    .domain-btn.open  { background: var(--domain-bg); }

    .domain-tag {
      background: var(--tag-bg); color: var(--tag-text);
      font-size: .67rem; font-weight: 700; padding: 2px 7px;
      border-radius: 3px; flex-shrink: 0; letter-spacing: .03em;
    }
    .domain-name { flex: 1; font-size: .79rem; }
    .domain-arrow { font-size: .58rem; color: #4a4f5e; flex-shrink: 0; transition: transform .2s; }
    .domain-btn.open .domain-arrow { transform: rotate(90deg); color: #666; }

    .topic-list { display: none; list-style: none; padding: 2px 0 4px; }
    .topic-list.open { display: block; }

    .topic-item {
      display: block; padding: 5px 14px 5px 34px;
      cursor: pointer; color: #747068; font-size: .76rem; line-height: 1.5;
      transition: background .1s, color .1s; user-select: none;
    }
    .topic-item:hover  { background: var(--hover); color: #bdb7ae; }
    .topic-item.active { background: var(--active-bg); color: var(--active-text); font-weight: 500; }

    /* ── 메인 (스크롤 컨테이너) ── */
    main {
      flex: 1; min-width: 0; min-height: 0;
      overflow-y: auto; overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
    }
    .content-wrap { max-width: 860px; margin: 0 auto; }

    .placeholder {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 70vh; color: var(--muted); gap: 12px;
    }
    .placeholder-icon { font-size: 2.8rem; opacity: .3; }
    .placeholder-text { font-size: .88rem; }

    .loading { display: none; align-items: center; justify-content: center; min-height: 70vh; }
    .loading.show { display: flex; }
    .spinner {
      width: 20px; height: 20px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    iframe#viewer {
      width: 100%; border: none; display: none;
      background: var(--content-bg); border-top: 1px solid var(--border);
    }
    iframe#viewer.show { display: block; }

    /* ── 모드 버튼 ── */
    .mode-btns { display: flex; gap: 3px; }
    .mode-btn {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.1);
      color: #888; cursor: pointer;
      border-radius: 7px; width: 34px; height: 34px;
      font-size: .95rem;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; -webkit-tap-highlight-color: transparent;
    }
    .mode-btn:hover { background: rgba(255,255,255,.14); color: #ccc; }
    .mode-btn.active {
      background: rgba(193,117,80,.3);
      border-color: rgba(193,117,80,.6);
      color: var(--accent);
    }

    /* ── 오버레이 (모바일) ── */
    .overlay {
      display: none; position: fixed; inset: 0; top: var(--header-h);
      background: rgba(0,0,0,.45); z-index: 99;
    }
    .overlay.show { display: block; }

    /* ── 모바일 ── */
    @media (max-width: 680px) {
      :root { --sidebar-w: 240px; }
      .btn-menu { display: block; }

      aside {
        position: fixed; top: var(--header-h); left: 0; bottom: 0; z-index: 100;
        transform: translateX(-100%); transition: transform .25s ease;
        box-shadow: 4px 0 28px rgba(0,0,0,.4);
      }
      aside.open { transform: translateX(0); }
      .content-wrap { max-width: 100%; }
    }
  </style>
</head>
<body>

<header>
  <button class="btn-menu" id="btnMenu">☰</button>
  <div class="logo">📚 <em>서브노트</em></div>
  <div class="breadcrumb" id="breadcrumb">토픽을 선택하세요</div>
  <div class="header-right">
    <div class="mode-btns">
      <button class="mode-btn" id="modeBtn1" title="토픽명만 보기">1️⃣</button>
      <button class="mode-btn" id="modeBtn2" title="정의/키워드/분류만 보기">2️⃣</button>
      <button class="mode-btn active" id="modeBtn3" title="전체 보기">3️⃣</button>
    </div>
    <button class="nav-btn" id="btnRand" title="랜덤 토픽">🎲</button>
    <button class="nav-btn" id="btnPrev" title="이전 토픽" disabled>⬆</button>
    <button class="nav-btn" id="btnNext" title="다음 토픽" disabled>⬇</button>
  </div>
</header>

<div class="layout">
  <aside id="sidebar">
    <nav id="nav">
      <div style="padding:20px 14px;color:#444;font-size:.76rem;">불러오는 중…</div>
    </nav>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main id="mainEl">
    <div class="content-wrap">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">📖</div>
        <div class="placeholder-text">좌측에서 토픽을 선택하세요</div>
      </div>
      <div class="loading" id="loading"><div class="spinner"></div></div>
      <iframe id="viewer" title="토픽 뷰어" scrolling="no"></iframe>
    </div>
  </main>
</div>

<script>
const nav        = document.getElementById('nav');
const viewer     = document.getElementById('viewer');
const placeholder = document.getElementById('placeholder');
const loading    = document.getElementById('loading');
const breadcrumb = document.getElementById('breadcrumb');
const sidebar    = document.getElementById('sidebar');
const overlay    = document.getElementById('overlay');
const btnMenu    = document.getElementById('btnMenu');
const mainEl     = document.getElementById('mainEl');

let activeItem    = null;
let allTopics     = [];
let currentIndex  = -1;
let recentDomains = [];  // 최근 방문 도메인 기록 (최대 3개)
let currentMode   = parseInt(localStorage.getItem('snb_mode') || '3');

const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnRand = document.getElementById('btnRand');

btnPrev.addEventListener('click', () => {
  if (currentIndex > 0) goToIndex(currentIndex - 1);
});
btnNext.addEventListener('click', () => {
  if (currentIndex < allTopics.length - 1) goToIndex(currentIndex + 1);
});
btnRand.addEventListener('click', () => {
  if (!allTopics.length) return;

  // 현재 토픽 + 최근 방문 도메인을 제외한 후보 풀 생성
  let candidates = allTopics
    .map((t, i) => ({ t, i }))
    .filter(({ t, i }) =>
      i !== currentIndex &&                       // 현재 토픽 제외
      !recentDomains.slice(0, 2).includes(t.domain) // 최근 2개 도메인 제외
    );

  // 후보가 없으면 (도메인 수가 적을 때) 현재 토픽만 제외
  if (candidates.length === 0) {
    candidates = allTopics
      .map((t, i) => ({ t, i }))
      .filter(({ i }) => i !== currentIndex);
  }

  // 그래도 없으면 (토픽 1개) 그냥 선택
  if (candidates.length === 0) return;

  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  goToIndex(pick.i);
});

function goToIndex(idx) {
  const t = allTopics[idx];
  if (t) loadTopic(t.domain, t.id, t.name, t.label, false);
}

function updateNavBtns() {
  btnPrev.disabled = currentIndex <= 0;
  btnNext.disabled = currentIndex < 0 || currentIndex >= allTopics.length - 1;
}

/* ── 사이드바 토글 (모바일) ── */
btnMenu.addEventListener('click', () => {
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', closeSidebar);
function closeSidebar() {
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

/* ── iframe 높이 조정 ── */
function resizeIframe() {
  try {
    const doc  = viewer.contentDocument;
    const win  = viewer.contentWindow;
    const body = doc.body;
    viewer.style.height = '1px';
    const cs = win.getComputedStyle(body);
    const pb = parseFloat(cs.paddingBottom) || 0;
    let maxBottom = 0;
    for (const child of body.children) {
      const r  = child.getBoundingClientRect();
      const mb = parseFloat(win.getComputedStyle(child).marginBottom) || 0;
      if (r.height > 0) maxBottom = Math.max(maxBottom, r.bottom + mb);
    }
    const h = Math.ceil(maxBottom + pb);
    viewer.style.height = (h > 50 ? h : body.scrollHeight) + 'px';
  } catch(e) {
    viewer.style.height = '80vh';
  }
}

/* ── 암기 모드 적용 ── */
function applyMode(mode) {
  try {
    const doc  = viewer.contentDocument;
    if (!doc || !doc.body) return;
    const body = doc.body;

    // 이전 주입 스타일 제거
    const old = doc.getElementById('__mode_style__');
    if (old) old.remove();

    // 이전 모드 클래스 초기화
    doc.querySelectorAll('.__show').forEach(el => el.classList.remove('__show'));

    if (mode === 3) {
      // 전체 보기 — 모든 요소 표시 복원
      doc.querySelectorAll('[style*="display"]').forEach(el => el.style.display = '');
      resizeIframe();
      return;
    }

    const style = doc.createElement('style');
    style.id = '__mode_style__';

    if (mode === 1) {
      // 제목만 보기
      style.textContent = `
        body > *:not(h1):not(h2):not(h3):not(h4) { display: none !important; }
        h1,h2,h3,h4 { display: block !important; }
      `;
      doc.head.appendChild(style);
    }

    if (mode === 2) {
      // 정의/키워드/분류 li만 보기
      style.textContent = `
        ul, ol, table, p, .table-scroll, blockquote,
        pre, details, figure, img, hr, .callout { display: none !important; }
        ul.__show, ol.__show { display: block !important; }
        li.__show { display: list-item !important; }
      `;
      doc.head.appendChild(style);

      const SHOW_KEYWORDS = ['정의', '키워드', '분류'];
      doc.querySelectorAll('ul, ol').forEach(list => {
        let hasVisible = false;
        list.querySelectorAll(':scope > li').forEach(li => {
          const strongText = li.querySelector('strong, b')?.textContent || '';
          const liText     = li.childNodes[0]?.textContent?.trim() || '';
          const match = SHOW_KEYWORDS.some(k =>
            strongText.includes(k) || liText.startsWith(k)
          );
          if (match) { li.classList.add('__show'); hasVisible = true; }
        });
        if (hasVisible) list.classList.add('__show');
      });
    }

    resizeIframe();
  } catch(e) {
    console.warn('모드 적용 실패:', e);
  }
}

function setMode(mode) {
  currentMode = mode;
  localStorage.setItem('snb_mode', mode);
  [1, 2, 3].forEach(n => {
    document.getElementById(`modeBtn${n}`)
      .classList.toggle('active', n === mode);
  });
  applyMode(mode);
}

// 모드 버튼 이벤트
[1, 2, 3].forEach(n => {
  document.getElementById(`modeBtn${n}`)
    .addEventListener('click', () => setMode(n));
});

// 초기 버튼 상태 반영
[1, 2, 3].forEach(n => {
  document.getElementById(`modeBtn${n}`)
    .classList.toggle('active', n === currentMode);
});

/* ── topics.json 로드 ── */
async function init() {
  try {
    const res  = await fetch('topics.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('topics.json 없음');
    const data = await res.json();
    renderNav(data);

    const hash = location.hash.slice(1);
    if (hash) {
      const [domain, id] = hash.split('/');
      if (domain && id && data[domain]) {
        const t = data[domain].topics.find(t => t.id === id);
        if (t) loadTopic(domain, id, t.name, data[domain].label, true);
      }
    }
  } catch(e) {
    nav.innerHTML = `<div style="padding:14px;color:#f87;font-size:.76rem;">⚠ 로드 실패: ${e.message}</div>`;
  }
}

/* ── 네비게이션 렌더링 ── */
function renderNav(data) {
  nav.innerHTML = '';
  allTopics = [];
  Object.entries(data).forEach(([fname, info]) => {
    info.topics.forEach(t => {
      allTopics.push({ domain: fname, id: t.id, name: t.name, label: info.label });
    });

    const btn = document.createElement('button');
    btn.className = 'domain-btn';
    btn.innerHTML = `
      <span class="domain-tag">${info.label}</span>
      <span class="domain-name">${info.desc}</span>
      <span class="domain-arrow">▶</span>`;

    const ul = document.createElement('ul');
    ul.className = 'topic-list';

    info.topics.forEach(topic => {
      const li = document.createElement('li');
      li.className   = 'topic-item';
      li.textContent = topic.name;
      li.dataset.domain = fname;
      li.dataset.id     = topic.id;
      li.addEventListener('click', () => {
        loadTopic(fname, topic.id, topic.name, info.label, false);
        closeSidebar();
      });
      ul.appendChild(li);
    });

    btn.addEventListener('click', () => {
      const isOpen = btn.classList.contains('open');
      document.querySelectorAll('.domain-btn.open').forEach(b => {
        b.classList.remove('open');
        b.nextElementSibling?.classList.remove('open');
      });
      if (!isOpen) { btn.classList.add('open'); ul.classList.add('open'); }
    });

    nav.appendChild(btn);
    nav.appendChild(ul);
  });
}

/* ── 토픽 로드 ── */
function loadTopic(domain, id, name, label, skipOpen) {
  if (activeItem) activeItem.classList.remove('active');
  const item = nav.querySelector(`.topic-item[data-domain="${domain}"][data-id="${id}"]`);
  if (item) {
    item.classList.add('active');
    activeItem = item;
    if (!skipOpen) {
      const ul  = item.closest('.topic-list');
      const btn = ul?.previousElementSibling;
      if (ul && btn) {
        document.querySelectorAll('.domain-btn.open').forEach(b => {
          b.classList.remove('open');
          b.nextElementSibling?.classList.remove('open');
        });
        btn.classList.add('open'); ul.classList.add('open');
      }
    }
    item.scrollIntoView({ block: 'nearest' });
  }

  breadcrumb.textContent = `${label} / ${name}`;
  history.replaceState(null, '', `#${domain}/${id}`);

  currentIndex = allTopics.findIndex(t => t.domain === domain && t.id === id);
  updateNavBtns();

  // 최근 방문 도메인 갱신 (중복 제거 후 앞에 추가, 최대 3개 유지)
  recentDomains = [domain, ...recentDomains.filter(d => d !== domain)].slice(0, 3);

  placeholder.style.display = 'none';
  viewer.classList.remove('show');
  viewer.style.height = 'auto';
  loading.classList.add('show');

  viewer.onload = () => {
    loading.classList.remove('show');
    requestAnimationFrame(() => {
      applyMode(currentMode);   // 현재 모드 적용
      viewer.classList.add('show');
      mainEl.scrollTo({ top: 0 });
    });
  };
  viewer.src = `topics/${domain}/${id}.html?v=${Date.now()}`;
}

init();
</script>
</body>
</html>
