title: System Recon Chain via cmd (systeminfo + reg query)
id: 8a1b2c3d-0001-0001-0001-000000000002
status: experimental
description: |
  cmd.exe를 통해 systeminfo와 레지스트리 조회를 연쇄 실행하는
  정찰 패턴 탐지. 가상환경/시스템 정보 수집 시도(T1082).
  내장 룰(92032)은 이를 level3 T1059.003으로 오분류하므로 정밀 탐지용.
references:
  - https://attack.mitre.org/techniques/T1082/
author: HARKJIN
date: 2026/09/12
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\systeminfo.exe'
    ParentImage|endswith: '\cmd.exe'
    ParentCommandLine|contains|all:
      - 'systeminfo'
      - 'reg query'
  condition: selection
falsepositives:
  - 정상적인 시스템 인벤토리 스크립트
level: medium
tags:
  - attack.discovery
  - attack.t1082
