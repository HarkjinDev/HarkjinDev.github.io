title: Suspicious Script/Executable Dropped in Temp by PowerShell
id: 8a1b2c3d-0002-0001-0001-000000000010
status: experimental
description: |
  PowerShell이 Temp 등 의심 폴더에 스크립트/실행파일을 생성하는 행위 탐지(T1105).
  단, PowerShell이 정상 생성하는 __PSScriptPolicyTest 임시파일은 오탐이므로 제외.
  내장 룰(92213)이 이 정상 임시파일을 level15로 오탐하는 문제를 교정.
references:
  - https://attack.mitre.org/techniques/T1105/
author: HARKJIN
date: 2026/09/12
logsource:
  product: windows
  category: file_event
detection:
  selection:
    Image|endswith: '\powershell.exe'
    TargetFilename|contains:
      - '\AppData\Local\Temp\'
      - '\Windows\Temp\'
    TargetFilename|endswith:
      - '.ps1'
      - '.exe'
      - '.dll'
      - '.bat'
  filter_pspolicy:
    TargetFilename|contains: '__PSScriptPolicyTest_'
  condition: selection and not filter_pspolicy
falsepositives:
  - 정상 소프트웨어 설치 과정의 임시 스크립트
level: medium
tags:
  - attack.command_and_control
  - attack.t1105
